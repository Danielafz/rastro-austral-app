<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cielo-estepa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="suelo-mision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <!-- Cielo austral y horizonte amplio de estepa -->
  <rect width="400" height="220" fill="url(#cielo-estepa)"/>
  <circle cx="320" cy="65" r="28" fill="#fde68a" opacity="0.3"/>
  <path d="M0,135 Q100,128 220,133 T400,130 L400,220 L0,220 Z" fill="#854d0e" opacity="0.4"/>
  <rect y="138" width="400" height="82" fill="url(#suelo-mision)"/>

  <!-- Cerco histórico de estacas -->
  <g stroke="#a16207" stroke-width="1.5">
    <line x1="20" y1="165" x2="20" y2="185"/>
    <line x1="45" y1="165" x2="45" y2="185"/>
    <line x1="70" y1="165" x2="70" y2="185"/>
    <line x1="95" y1="165" x2="95" y2="185"/>
    <line x1="120" y1="165" x2="120" y2="185"/>
    <line x1="15" y1="172" x2="125" y2="172"/>
    <line x1="15" y1="179" x2="125" y2="179"/>
  </g>

  <!-- Capilla y Campanario de la Misión Salesiana -->
  <!-- Nave principal -->
  <rect x="150" y="110" width="115" height="60" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <polygon points="145,110 207,75 270,110" fill="#b91c1c"/>
  <!-- Puerta arqueada -->
  <path d="M195,170 L195,142 Q207,132 220,142 L220,170 Z" fill="#451a03"/>
  <!-- Ventanas ojivales -->
  <path d="M165,150 L165,135 Q172,128 180,135 L180,150 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M235,150 L235,135 Q242,128 250,135 L250,150 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Campanario -->
  <rect x="265" y="80" width="40" height="90" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <polygon points="260,80 285,45 310,80" fill="#991b1b"/>
  <!-- Campana y arco -->
  <path d="M275,108 L275,95 Q285,88 295,95 L295,108 Z" fill="#1e293b"/>
  <ellipse cx="285" cy="100" rx="4" ry="5" fill="#f59e0b"/>
  <!-- Cruz en el campanario -->
  <line x1="285" y1="45" x2="285" y2="28" stroke="#f8fafc" stroke-width="2.5"/>
  <line x1="279" y1="35" x2="291" y2="35" stroke="#f8fafc" stroke-width="2.5"/>

  <!-- Mata negra y vegetación de estepa -->
  <ellipse cx="80" cy="195" rx="18" ry="8" fill="#365314"/>
  <ellipse cx="340" cy="190" rx="22" ry="9" fill="#365314"/>
  <ellipse cx="370" cy="195" rx="16" ry="7" fill="#4d7c0f"/>
</svg>
