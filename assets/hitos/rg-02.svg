<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cielo-hilado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lana-dorada" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Cielo y horizonte de estepa norte -->
  <rect width="400" height="220" fill="url(#cielo-hilado)"/>
  
  <path d="M0,140 Q120,130 240,138 T400,135 L400,220 L0,220 Z" fill="#713f12" opacity="0.5"/>
  <rect y="150" width="400" height="70" fill="#292524"/>

  <!-- Silueta de ovejas Corriedale en la pradera fueguina -->
  <g fill="#f8fafc" opacity="0.85">
    <!-- Oveja 1 -->
    <ellipse cx="65" cy="140" rx="14" ry="10"/>
    <circle cx="50" cy="134" r="5" fill="#475569"/>
    <line x1="56" y1="148" x2="56" y2="158" stroke="#475569" stroke-width="2"/>
    <line x1="62" y1="148" x2="62" y2="158" stroke="#475569" stroke-width="2"/>
    <line x1="70" y1="148" x2="70" y2="158" stroke="#475569" stroke-width="2"/>
    <!-- Oveja 2 -->
    <ellipse cx="95" cy="144" rx="12" ry="9"/>
    <circle cx="83" cy="139" r="4.5" fill="#475569"/>
    <line x1="88" y1="151" x2="88" y2="160" stroke="#475569" stroke-width="1.8"/>
    <line x1="98" y1="151" x2="98" y2="160" stroke="#475569" stroke-width="1.8"/>
  </g>

  <!-- Rueda de Hilar tradicional de madera (rueca patagónica) -->
  <circle cx="280" cy="115" r="45" stroke="#b45309" stroke-width="4" fill="none"/>
  <circle cx="280" cy="115" r="12" fill="#78350f"/>
  <!-- Rayos de la rueca -->
  <g stroke="#d97706" stroke-width="2">
    <line x1="280" y1="70" x2="280" y2="160"/>
    <line x1="235" y1="115" x2="325" y2="115"/>
    <line x1="248" y1="83" x2="312" y2="147"/>
    <line x1="248" y1="147" x2="312" y2="83"/>
  </g>
  <!-- Estructura del soporte y pedal -->
  <line x1="280" y1="125" x2="280" y2="195" stroke="#78350f" stroke-width="5"/>
  <line x1="240" y1="195" x2="320" y2="195" stroke="#78350f" stroke-width="5"/>
  <line x1="250" y1="130" x2="220" y2="175" stroke="#b45309" stroke-width="4"/>
  <!-- Huso y vellón de lana hilándose -->
  <ellipse cx="215" cy="165" rx="10" ry="16" fill="#fef08a"/>
  <path d="M215,150 Q240,135 280,115" stroke="#fef08a" stroke-width="1.8" fill="none"/>

  <!-- Madejas de lana teñidas artesanalmente (tonos estepa, calafate y líquenes) -->
  <ellipse cx="140" cy="185" rx="24" ry="14" fill="#a855f7"/>
  <path d="M125,178 Q140,170 155,182 Q135,195 125,178" stroke="#d8b4fe" stroke-width="2.5" fill="none"/>

  <ellipse cx="180" cy="188" rx="22" ry="13" fill="#eab308"/>
  <path d="M165,182 Q180,175 195,186 Q175,197 165,182" stroke="#fef08a" stroke-width="2.5" fill="none"/>

  <ellipse cx="160" cy="175" rx="20" ry="12" fill="#0284c7"/>
  <path d="M148,170 Q160,165 172,174" stroke="#7dd3fc" stroke-width="2" fill="none"/>

  <!-- Telar vertical con tejido de guarda greca tradicional -->
  <rect x="20" y="40" width="80" height="95" stroke="#78350f" stroke-width="4" fill="#1c1917" rx="2"/>
  <g stroke="#f59e0b" stroke-width="1">
    <line x1="30" y1="40" x2="30" y2="135"/>
    <line x1="42" y1="40" x2="42" y2="135"/>
    <line x1="54" y1="40" x2="54" y2="135"/>
    <line x1="66" y1="40" x2="66" y2="135"/>
    <line x1="78" y1="40" x2="78" y2="135"/>
    <line x1="90" y1="40" x2="90" y2="135"/>
  </g>
  <!-- Franjas tejidas -->
  <rect x="22" y="85" width="76" height="15" fill="#ea580c"/>
  <rect x="22" y="100" width="76" height="18" fill="#4f46e5"/>
  <rect x="22" y="118" width="76" height="15" fill="#059669"/>
</svg>
