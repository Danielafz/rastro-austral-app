<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cielo-kamuk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="montana-kamuk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Cielo y Montañas -->
  <rect width="400" height="220" fill="url(#cielo-kamuk)"/>
  <circle cx="80" cy="55" r="22" fill="#fbbf24" opacity="0.25"/>
  <polygon points="20,150 110,65 200,150" fill="url(#montana-kamuk)"/>
  <polygon points="140,150 250,45 360,150" fill="url(#montana-kamuk)"/>
  <polygon points="225,75 250,45 275,75" fill="#f8fafc" opacity="0.8"/>
  
  <!-- Suelo de bosque andino-patagónico -->
  <rect y="140" width="400" height="80" fill="#1c1917"/>
  <path d="M0,155 Q100,145 200,155 T400,150 L400,220 L0,220 Z" fill="#292524"/>

  <!-- Bosque de lengas -->
  <polygon points="60,165 70,115 80,165" fill="#14532d"/>
  <polygon points="85,160 95,105 105,160" fill="#166534"/>
  <polygon points="110,165 120,120 130,165" fill="#15803d"/>
  <polygon points="280,160 290,110 300,160" fill="#14532d"/>
  <polygon points="305,165 315,115 325,165" fill="#166534"/>
  <polygon points="330,160 340,105 350,160" fill="#15803d"/>

  <!-- Aserradero histórico (galpón de lenga) -->
  <rect x="160" y="115" width="105" height="65" fill="url(#madera)" rx="2"/>
  <polygon points="150,115 212,75 275,115" fill="#b45309"/>
  <!-- Tablones y ventanas -->
  <line x1="175" y1="115" x2="175" y2="180" stroke="#451a03" stroke-width="1.5"/>
  <line x1="190" y1="115" x2="190" y2="180" stroke="#451a03" stroke-width="1.5"/>
  <line x1="205" y1="115" x2="205" y2="180" stroke="#451a03" stroke-width="1.5"/>
  <line x1="220" y1="115" x2="220" y2="180" stroke="#451a03" stroke-width="1.5"/>
  <line x1="235" y1="115" x2="235" y2="180" stroke="#451a03" stroke-width="1.5"/>
  <line x1="250" y1="115" x2="250" y2="180" stroke="#451a03" stroke-width="1.5"/>
  <!-- Portón del aserradero -->
  <rect x="185" y="140" width="30" height="40" fill="#451a03"/>
  <rect x="228" y="130" width="22" height="22" fill="#fef08a" opacity="0.85" rx="1"/>
  <line x1="239" y1="130" x2="239" y2="152" stroke="#78350f" stroke-width="1.5"/>
  <line x1="228" y1="141" x2="250" y2="141" stroke="#78350f" stroke-width="1.5"/>

  <!-- Rollizos de madera en primer plano -->
  <ellipse cx="60" cy="190" rx="14" ry="9" fill="#d97706" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="78" cy="192" rx="14" ry="9" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="69" cy="182" rx="13" ry="8" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
</svg>
