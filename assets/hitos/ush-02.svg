<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="estudio-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="tinta-botanica" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Fondo de taller de diseño -->
  <rect width="400" height="220" fill="url(#estudio-bg)"/>
  
  <!-- Patrones geométricos y botánicos de fondo (hojas de lenga y michay) -->
  <g opacity="0.15" stroke="#fbcfe8" stroke-width="2" fill="none">
    <circle cx="80" cy="70" r="45"/>
    <circle cx="330" cy="60" r="50"/>
    <path d="M50,140 Q80,90 110,140 Q80,190 50,140 Z"/>
    <path d="M300,120 Q330,70 360,120 Q330,170 300,120 Z"/>
  </g>

  <!-- Mesa de trabajo del colectivo -->
  <rect y="160" width="400" height="60" fill="#2e1065"/>
  <rect y="156" width="400" height="6" fill="#a855f7" opacity="0.6"/>

  <!-- Cerámica y jarrones artesanales -->
  <!-- Jarrón central -->
  <path d="M190,165 Q180,125 195,100 L215,100 Q230,125 220,165 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="205" cy="100" rx="10" ry="3.5" fill="#f59e0b"/>
  <path d="M188,135 Q205,142 222,135" stroke="#78350f" stroke-width="2.5" fill="none"/>
  
  <!-- Cuenco de tintes naturales -->
  <ellipse cx="140" cy="165" rx="28" ry="16" fill="#047857"/>
  <ellipse cx="140" cy="160" rx="22" ry="9" fill="#10b981"/>

  <!-- Pincel y herramientas de ilustración -->
  <line x1="120" y1="130" x2="145" y2="160" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  <polygon points="115,125 122,132 118,136" fill="#78350f"/>

  <!-- Madeja de hilo teñido con líquenes -->
  <circle cx="270" cy="155" r="22" fill="#8b5cf6"/>
  <path d="M255,145 Q270,135 285,150 Q265,165 255,145" stroke="#c084fc" stroke-width="3" fill="none"/>
  <path d="M260,160 Q275,170 288,155" stroke="#ede9fe" stroke-width="2" fill="none"/>

  <!-- Motivo botánico enmarcado (estampa serigráfica) -->
  <rect x="30" y="30" width="90" height="110" fill="#09090b" rx="4" stroke="#a855f7" stroke-width="2"/>
  <!-- Rama estilizada -->
  <path d="M75,120 Q75,60 85,45" stroke="#34d399" stroke-width="3" fill="none"/>
  <ellipse cx="65" cy="85" rx="10" ry="5" fill="#10b981" transform="rotate(-30 65 85)"/>
  <ellipse cx="88" cy="70" rx="10" ry="5" fill="#10b981" transform="rotate(30 88 70)"/>
  <ellipse cx="70" cy="55" rx="8" ry="4" fill="#34d399" transform="rotate(-25 70 55)"/>

  <!-- Telar o bastidor -->
  <rect x="290" y="35" width="80" height="95" fill="none" stroke="#d97706" stroke-width="4" rx="2"/>
  <g stroke="#e2e8f0" stroke-width="1.2" opacity="0.7">
    <line x1="300" y1="35" x2="300" y2="130"/>
    <line x1="312" y1="35" x2="312" y2="130"/>
    <line x1="324" y1="35" x2="324" y2="130"/>
    <line x1="336" y1="35" x2="336" y2="130"/>
    <line x1="348" y1="35" x2="348" y2="130"/>
    <line x1="360" y1="35" x2="360" y2="130"/>
  </g>
  <path d="M295,75 Q330,65 365,75" stroke="#ec4899" stroke-width="4" fill="none"/>
  <path d="M295,95 Q330,105 365,95" stroke="#8b5cf6" stroke-width="5" fill="none"/>
</svg>
